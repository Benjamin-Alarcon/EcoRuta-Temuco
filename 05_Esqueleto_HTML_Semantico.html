<!--
  Desarrollo de Frontend (ICINF1107) · Semana 3
  Esqueleto HTML con espacios en blanco — Taller guiado (09:50-10:30)

  Cómo se usa en clase:
  El docente proyecta este archivo en el editor de código y, en conjunto
  con el curso, va reemplazando cada <div class="blank" data-n="N"> por
  la etiqueta HTML semántica correcta -- por ejemplo:

      <div class="blank" data-n="1"> ... </div>
      se convierte en
      <header> ... </header>

  Al reemplazar la etiqueta, también se elimina el atributo class="blank"
  data-n="N" (ya cumplió su función de marcar el bloque pendiente).
  starter.css ya está enlazado: apenas se usa la etiqueta correcta,
  aparece el borde de color y la etiqueta con su nombre.

  Es la misma vista genérica (portal de noticias) que se trabajó en la
  actividad individual en papel -- ideal para comparar respuestas.

  Numeración de los 8 bloques pendientes:
  1 header (cabecera)          5 article (noticia 1)
  2 nav (dentro de la cabecera) 6 article (noticia 2)
  3 section (banner principal)  7 aside (más leídas)
  4 main (contenido principal)  8 footer (pie de página)
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Noticias — vista genérica (esqueleto)</title>
<link rel="stylesheet" href="06_starter.css">
</head>
<body>

  <!-- 1: agrupa el logo y la navegación -->
  <header>
    <img src="LOGO.png">
    <style>
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    header img {
      max-height: 60px;
      width: auto;
    }

    nav {
      display: flex;
      gap: 15px;
    }
  </style>

    <!-- 2: bloque de navegación -->
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Categorías</a>
      <a href="#">Nosotros</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <!-- 3: banner principal, con el h1 del sitio -->
  <section>
    <h1>Eco Rutas Temuco</h1>
    <p>Encuentra tu proximo destino soñado</p>
    <img src="Temuco1.jpg" alt="Paisaje de portada">
  </section>

  <!-- 4: contenido principal, único por página -->
  <main>

    <!-- 5: noticia independiente y autocontenida -->
    <article>
      <h2>PUCÓN (Zona la custre)</h2>
      <p>20.000 x persona</p>
      <img src="pucon.jpg" alt="">
    </article>

    <!-- 6: noticia independiente y autocontenida -->
    <article>
      <img src="termas.jpg" alt="">
      <h2>Termas Geometricas</h2>
      <p>Precio: 45.000 cada persona</p>
    </article>

    <!-- 7: contenido secundario, relacionado con el principal -->
    <aside>
      <h2>Más leídas</h2>
      <ul>
        <li>Temas Geometricas (PUCÓN)</li>
        <li>PUCÓN</li>
        <li>Temuco</li>
      </ul>
    </aside>

  </main>

  <!-- 8: pie de página -->
  <footer>
    <p>&copy; 2026 Eco Rutas TEMUCO</p>
  </footer>

</body>
</html>
