<!--
  Desarrollo de Frontend (ICINF1107) · Semana 3
  Esqueleto HTML con espacios en blanco — Taller guiado (09:50-10:30)

  Cómo se usa en clase:
  El docente proyecta este archivo en el editor de código y, en conjunto
  con el curso, va reemplazando cada <div class="blank" data-n="N"> por
  la etiqueta HTML semántica correcta -- por ejemplo:

      <div class="blank" data-n="1"> ... </div>
      se convierte en
      <header> ... </header>

  Al reemplazar la etiqueta, también se elimina el atributo class="blank"
  data-n="N" (ya cumplió su función de marcar el bloque pendiente).
  starter.css ya está enlazado: apenas se usa la etiqueta correcta,
  aparece el borde de color y la etiqueta con su nombre.

  Es la misma vista genérica (portal de noticias) que se trabajó en la
  actividad individual en papel -- ideal para comparar respuestas.

  Numeración de los 8 bloques pendientes:
  1 header (cabecera)          5 article (noticia 1)
  2 nav (dentro de la cabecera) 6 article (noticia 2)
  3 section (banner principal)  7 aside (más leídas)
  4 main (contenido principal)  8 footer (pie de página)
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRuta</title>
<link rel="stylesheet" href="06_starter.css">
</head>
<body>

  <header>
    <!-- 2: bloque de navegación -->
    <nav class="blank" data-n="2">
      <a href="#">familia</a>
      <a href="#">explorar</a>
    </nav>
    <button aria-label="buscar">🔍</button>
  </header>

  
  <section>
    <p>ARAUCANIA, CHILE</p>
    <h1>EcoRuta</h1>
    <p>Tu portal de eco-turismo familiar en el sur.</p>
  </section>

  <main>

 
    <div>
      <h2>seccion familia <p>24/7</p></h2>
      <button>⚙️</button>
    </div>

    <button>+ Agregar Integrante</button>

    <h2>Recomendados</h2>
    <article>
      <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/08/b1/a7/4e/volcan-villarica.jpg?w=1200&h=1200&s=1" alt="Volcán Villarrica">
      <h3>Volcán Villarrica</h3>
      <p>⭐ 5.0</p>
      <p>DESDE <strong>CLP 120.000</strong></p>
    </article>

    <article>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmM_P72d2Avc-h-jKSkVWuFqc279IHKoQW8qN_TxQclqXAOLHUsXRX2Y-O&s=10" alt="Parque Conguillío">
      <h3>Parque Conguillío</h3>
      <p>⭐ 4.8</p>
      <p>DESDE <strong>CLP 90.000</strong></p>
    </article>
    
  </main>

  <!-- 8: pie de página -->
  <footer>
    <p>Integrantes: <strong>4</strong></p>
    <p>TOTAL ACUMULADO <strong>CLP 210.000</strong></p>
  </footer>

</body>
</html>
